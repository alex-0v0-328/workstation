name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run smoke
      - run: npm run package
      - run: node scripts/packaged-check.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: workstation-windows-x64
          path: release/*.exe
